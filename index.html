function dashboard(){const total=state.apps.reduce((s,a)=>s+a.ton,0),approved=state.apps.filter(a=>a.approval==='Onaylandı'),support=approved.reduce((s,a)=>s+C.calculate(a.cost).support,0),co=state.apps.reduce((s,a)=>s+C.calculate(a.cost).coSaving,0),rs=state.reservations.filter(r=>r.status!=='İptal');return head('Yükün geleceği, tek merkezde.','Pilot koridorları, taşıma taleplerini ve teşvik sürecini birlikte yönetin.',btn(icon('plus')+' Yeni taşıma planla','nav','primary','data-page="planner"'))+'<div class="grid g4 mb">'+metric('Planlanan yük',fmt(total)+' <small>ton</small>',state.apps.length+' örnek / yerel başvuru','box')+metric('Onaylı destek tahmini',tl(support),'Maliyet açığı ve tavanlar sonrası','money')+metric('Etkin rezervasyon',fmt(rs.length)+' <small>kayıt</small>','Bekleme dâhil · Bu cihazdaki işlemler','calendar')+metric('CO₂e azaltım potansiyeli',fmt(co,1)+' <small>ton</small>','Gerçekleşen değil, planlanan yük tahmini','leaf',true)+'</div><div class="grid ratio mb"><section class="card"><div class="card-head"><div><h2>Pilot koridor ağı</h2><p>İlk ve son kilometreyle bütünleşik demiryolu taşımacılığı</p></div>'+badge('2 koridor')+'</div><div style="padding:0 18px 18px">'+map()+'</div></section><section class="card"><div class="card-head"><div><h2>Kapasite görünümü</h2><p>'+dateFmt(date)+' · örnek sefer planı</p></div>'+icon('calendar')+'</div>'+Object.values(C.CORRIDORS).map(c=>{const ss=getSlots(c.id,date),used=ss.reduce((n,s)=>n+C.availability(s,state.reservations).used,0),pct=Math.round(used/(ss.length*20)*100);return '<div class="corridor-item"><div class="between"><h4>'+c.name+'</h4>'+badge(c.code)+'</div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="between"><span>'+fmt(ss.length*20-used)+' / '+fmt(ss.length*20)+' boş vagon</span><strong>%'+pct+' doluluk</strong></div><div class="between mt8"><span>'+ss.length+' sefer penceresi</span><span>'+fmt((ss.length*20-used)*50)+' ton uygun</span></div></div>'}).join('')+'<div cl function plannerPage(){return head('Her kilometrenin hesabı açık.','Kapıdan kapıya taşıma maliyetini, süreyi ve destek seçeneklerini karşılaştırın.',btn(icon('refresh')+' Örnek değerler','planner-reset','ghost'))+'<div class="grid ratio-reverse"><section class="card pad"><form id="plannerForm"><div class="form-section"><h3 class="section-title"><span class="n">01</span>Yük ve güzergâh</h3><div class="form-grid"><div class="full">'+select('Pilot koridor','corridor',corridors,planner.corridor)+'</div>'+field('Yük miktarı · ton','ton',planner.ton,'number','min="1" max="100000" step="1" required')+field('20′ konteyner ihtiyacı','containers',planner.containers,'number','min="0" max="10000" step="1" required','Pilot yerleşim: en çok 2 konteyner / vagon')+field('İlk kilometre · km','first',planner.first,'number','min="0" max="2000" step="0.1" required')+field('Son kilometre · km','last',planner.last,'number','min="0" max="2000" step="0.1" required')+'</div></div><div class="form-section"><h3 class="section-title"><span class="n">02</span>Maliyet varsayımları</h3><div class="form-grid">'+field('TIR taşıma kapasitesi · ton','truckCapacity',planner.truckCapacity,'number','min="1" max="100" required')+field('20′ konteyner / TIR','truckContainers',planner.truckContainers,'number','min="1" max="2" step="1" required','Yerleşim varsayımı; araç ve yük uygunluğu teyit edilir.')+field('Karayolu birim fiyatı · ₺/TIR-km','truckRate',planner.truckRate,'number','min="0" step="0.01" required')+field('Demiryolu birim fiyatı · ₺/ton','railRate',planner.railRate,'number','min="0" step="0.0001" required')+field('Terminal + elleçleme · ₺/ton','handlingRate',planner.handlingRate,'number','min="0" step="0.01" required')+'</div><details><summary>Ek varsayımlar ve ticari elleçleme indirimi</summary><div class="form-grid">'+field('Elleçleme ticari indirimi · %','commercialDiscount',planner.commercialDiscount,'number','min="0" max="100" step="1"','%10 örneği; indirim sonrası tutar teşvik matrahıdır. function plannerResult(){if($('plannerRoute'))RailMaps.dispose($('plannerRoute'));let r;try{r=C.calculate(planner)}catch(e){$('plannerResults').innerHTML=note(esc(e.message),'bad');return}const c=C.CORRIDORS[planner.corridor];$('plannerRoute').innerHTML=map(planner.corridor)+'<div class="route-strip"><div class="route-stop"><strong>Yükleme noktası</strong><small>'+planner.first+' km karayolu</small></div><div class="route-stop"><strong>'+c.terminal+'</strong><small>'+c.railKm+' km demiryolu</small></div><div class="route-stop"><strong>'+c.endTerminal+'</strong><small>'+planner.last+' km karayolu</small></div><div class="route-stop"><strong>Teslim noktası</strong><small>'+fmt(r.hours,1)+' saat tahmini</small></div></div><div class="flex wrap">'+badge(r.wagons+' vagon')+badge(r.trucks+' TIR eşdeğeri')+badge(r.trains+' tren ihtiyacı')+badge(planner.speed+' km/sa tren hızı')+'</div>';$('plannerResults').innerHTML='<div class="between mb"><div><div class="eyebrow">MALİYET ÖZETİ</div><h2>Kapıdan kapıya maliyet</h2></div>'+badge(planner.policy==='report'?'Rapor kuralı':'Serbest senaryo',planner.policy==='report'?'good':'warn')+'</div>'+[['İlk kilometre',r.first,r.trucks+' TIR × '+planner.first+' km × '+planner.truckRate+' ₺'],['Demiryolu ana taşıma',r.rail,fmt(r.ton)+' ton × '+fmt(planner.railRate,4)+' ₺ / ton'],['Terminal ve elleçleme',r.handling,r.handlingDiscount?tl(r.handlingGross)+' − '+tl(r.handlingDiscount)+' ticari indirim':'Yükleme, boşaltma ve terminal hizmeti'],['Son kilometre',r.last,r.trucks+' TIR × '+planner.last+' km × '+planner.truckRate+' ₺']].map(([name,value,sub])=>'<div class="cost-line"><span>'+name+'<small>'+sub+'</small></span><strong class="num">'+tl(value)+'</strong></div>').join('')+(r.tacPass?'<div class="cost-line green"><span>Navluna yansıtılan erişim indirimi</span><strong>− '+tl(r.tacPass)+'</strong></div>':'')+'<div class="cost-line"><strong>Destek öncesi toplam</strong><strong>'+tl(r.gross)+'</strong></div><div class="cost-line green"><span>Yük sahibi desteği<small>'+tl(r.eligible)+' uygun maliyet · %'+r.rate+' oran</small></span><strong>− '+tl(r.support)+'</strong></div><div class="net-block"><p>YÜK SAHİBİNİN ÖDEYECEĞİ TAHMİNİ NET TUTAR</p><strong>'+tl(r.net)+'</strong><small>'+tl(r.perTon)+' / ton · KDV hariç pilot fiyatlar</small></div><div class="grid g2 mt"><div>'+badge((r.saving>=0?'Tasarruf: ':'Ek maliyet: ')+tl(Math.abs(r.saving)),r.saving>=0?'good':'warn')+'<p class="small muted mt8">Tam karayoluna göre</p></div><div>'+badge(fmt(r.coSaving,1)+' ton CO₂e '+(r.coSaving>=0?'azaltım':'fark'),r.coSaving>=0?'good':'warn')+'<p class="small muted mt8">İlk / son km emisyonu dâhil</p></div></div><div class="divider"></div><h3>Alternatiflerin karşılaştırması</h3>'+[['Tam karayolu',r.road,'gold'],['Kombine taşıma',r.gross,'navy'],['Destekli kombine',r.net,'']].map(([a,v,cl])=>'<div class="bar-row"><span>'+a+'</span><div class="bar"><i class="'+cl+'" style="width:'+v/Math.max(r.road,r.gross,r.net,1)*100+'%"></i></div><strong>'+tl(v)+'</strong></div>').join('')+note(planner.policy==='report'?(r.gap===0?'<strong>Bu senaryoda destek neden 0 ₺?</strong><br>Kombine taşıma, destek öncesinde de karayolundan ucuz. Raporun gerçek maliyet açığı sınırı sıfır olduğu için yük sahibi desteği oluşmaz. Oran etkisini incelemek için “Serbest senaryo” seçilebilir.':'Destek; oranla hesaplanan tutar, gerçek maliyet açığı, dışsal faydanın %50’si ve bütçe tavanının en düşüğüdür.'):'Serbest senaryo yalnızca oran ve bütçe tavanını kullanır. Politika karşılaştırması içindir; resmî uygunluk kararı değildir.',planner.policy==='scenario'?'warn':'')+'<details><summary>Hesabın dayanağı ve tüm tavanlar</summary><div><div class="cost-line"><span>Oran × uygun gider</span><strong>'+tl(r.raw)+'</strong></div><div class="cost-line"><span>Gerçek maliyet açığı</span><strong>'+tl(r.gap)+'</strong></div><div class="cost-line"><span>Dışsal faydanın %50’si</span><strong>'+tl(r.externalLimit)+'</strong></div><div class="cost-line"><span>Sevkiyat bütçe tavanı</span><strong>'+tl(r.cap)+'</strong></div><div class="cost-line"><span>DTİ erişim indirimi tahmini (ayrı)</span><strong>'+tl(r.tac)+'</strong></div><p class="small muted mt8">Ana taşıma bedeli yük sahibi destek matrahına dâhil değildir. TIR ve vagon ihtiyacı tonaj ile konteyner yerleşiminin büyük olanına göre yukarı yuvarlanır. Erişim indirimi navluna 1.000 ton kapasite içindeki tonaj payı kadar yansıtılır; aynı seferde tam tren indirimi yükler arasında tekrarlanmaz. Mesafeler ve ücretler kaynak örneklerden alınmış pilot girdilerdir; canlı tarife veya adres servisi değildir.</p></div></details>'+ (r.trains>1||r.containers>40?'<div class="mt">'+note('Bu plan tek tren kapasitesini aşıyor. Başvuruyu en çok 1.000 ton ve 40 konteynerlik ayrı sevkiyatlara bölün.','warn')+'</div>':'');RailMaps.init($('plannerRoute'));}

let dbPromise;function database(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('dtbs-documents-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>{dbPromise=null;reject(req.error)}});return dbPromise}
async function dbFile(action,id,file){const db=await database();return new Promise((resolve,reject)=>{const tx=db.transaction('files',action==='get'?'readonly':'readwrite'),store=tx.objectStore('files'),req=action==='put'?store.put(file,id):action==='delete'?store.delete(id):store.get(id);let result;req.onsuccess=()=>{result=req.result};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function invalidate(a){if(a.approval==='Onaylandı'){a.approval='İncelemede';a.changedAfterReview=true;state.reservations.filter(r=>r.app===a.id&&['Ön rezervasyon','Teyitli','Bekleme listesi'].includes(r.status)).forEach(r=>r.status='İptal');}a.paymentRequested=false;a.entitlement=null;}
let uploadChain=Promise.resolve();
function uploadDoc(input){const file=input.files[0],appId=input.dataset.app,type=input.dataset.docType,reference=state;if(!file)return;input.disabled=true;const task=uploadChain.then(()=>performUpload(file,appId,type,reference));uploadChain=task.catch(()=>{});return task.finally(()=>{input.disabled=false;input.value='';});}

e.storageFailure?'Belge kaydedilemedi. Önceki belge ve kayıt korundu.':e.message||'Belge kaydedilemedi.',true);}}

function entitlement(id){const a=getApp(id);if(!a)return;currentApp=id;const r=C.calculate({...a.cost,policy:'report'}),res=state.reservations.find(x=>x.app===a.id&&x.status!=='İptal'&&x.status!=='Bekleme listesi');showModal('Taşıma sonrası hakediş','<div class="mb">'+note('Hakediş, serbest senaryo seçilmiş olsa da rapor tavanlarıyla ve kantar tonajıyla yeniden hesaplanır. Navluna yalnız uygunluğu değerlendirilmiş DTİ indiriminin tonaj payı yansır. Bu işlem yerel taslaktır; ödeme oluşturmaz.')+'</div><form id="entitlementForm"><input name="id" type="hidden" value="'+a.id+'"><div class="grid g2"><section class="card pad"><h3 class="mb">'+a.id+' · Ön kontroller</h3>'+riskList(a)+'<div class="cost-line"><span>Belge ön onayı</span>'+badge(a.approval,a.approval==='Onaylandı'?'good':'warn')+'</div><div class="cost-line"><span>Taşıma teyidi</span>'+badge(a.delivered?'Tamamlandı':'Eksik',a.delivered?'good':'bad')+'</div><div class="cost-line"><span>Rezervasyon</span><strong>'+esc(res?.status||'Yok')+'</strong></div><div class="cost-line"><span>Yük sahibi destek tahmini</span><strong>'+tl(r.support)+'</strong></div><div class="cost-line"><span>DTİ indirim üst tahmini</span><strong>'+tl(r.tac)+'</strong></div><p class="small muted mt">DTİ indirimi tren bazındadır. Aynı seferin diğer sevkiyatlarında ikinci kez hakedişe eklenmez.</p></section><section class="card pad"><h3 class="mb">DTİ performansı ve uzman kararı</h3><div class="stack" style="gap:12px"><label class="check"><input name="dti" type="checkbox">DTİ erişim indirimi de değerlendirilsin.</label><label class="check"><input name="db2" type="checkbox">DB2, emniyet ve erişim sözleşmesi incelendi.</label><label class="check"><input name="ecm" type="checkbox">ECM ve emniyet kritik bakım şartları sağlandı.</label><label class="check"><input name="energy" type="checkbox">Cer türü, enerji ve lokomotif kayıtları tam.</label>'+field('Gerçekleşen / planlanan sefer · %','performance',90,'number','min="0" max="100" required')+field function simulationCalc(overrides={}){const p={...sim,...overrides},max=state.config.afyon+state.config.konya,base=state.config.baselineAfyon+state.config.baselineKonya,days=p.days,headroom=Math.max(0,max-base),targetRoom=Math.max(0,max*p.target/100-base),shift=Math.min(headroom*p.rate/100*p.elasticity,targetRoom)*1000*days,weights=Object.values(C.CORRIDORS).map(c=>({c,w:headroom?(state.config[c.id]-state.config[c.id==='afyon'?'baselineAfyon':'baselineKonya'])/headroom:0})),average=fn=>weights.reduce((n,{c,w})=>n+w*fn(c),0),avgRail=average(c=>c.railKm),avgRoad=average(c=>c.roadKm),ownerPerTon=average(c=>C.calculate({...C.DEFAULTS,corridor:c.id,railRate:c.railRate,first:c.first,last:c.last,scope:p.scope,policy:'scenario',rate:p.rate,cap:1000000}).support/1000),owner=shift*ownerPerTon,dti=p.access?shift/1000*avgRail*36*[.4,.3,.2][(p.year||1)-1]:0,expense=owner+dti,accessGross=shift/1000*avgRail*36,accessNet=accessGross-dti-shift/1000*avgRail*8.5,economic=shift*avgRoad*.8,co=shift*average(c=>c.roadKm*.07-c.railKm*.026-(c.first+c.last)*.07)/1000;return {shift,owner,dti,expense,accessGross,accessNet,fiscal:accessNet-owner,economic,co,trucks:shift/20,occupancy:max?(base+shift/(1000*days))/max*100:0,bc:expense?economic/expense:null};}
function simulationPage(){return head('Bir oran değişsin, etkisi görünür olsun.','Bütçeyi, kapasiteyi ve olası yük geçişini aynı varsayımlar altında karşılaştırın.',btn(icon('printer')+' Sunum çıktısı','print','ghost'))+'<div class="grid ratio-reverse"><section class="card pad no-print"><div class="eyebrow">SENARYO KONTROLLERİ</div><h2>Politikayı birlikte sınayın</h2><form id="simulationForm" class="mt"><label class="field mb"><span>Yük sahibi destek oranı <strong id="rateLabel" class="green" style="float:right">%'+sim.rate+'</strong></span><input type="range" name="rate" value="'+sim.rate+'" min="0" max="80" step="5"></label><label class="field mb"><span>Şebeke kullanım hedefi <strong id="targetLabel" class="green" style="float:right">%'+sim.target+'</strong></span><input type="range" name="target" value="'+sim.target+'" min="50" max="100" step="5"></label><div class="stack" style="gap:17px">'+select('Destek kapsamı','scope',[['all','İlk + son km + elleçleme'],['legs','İlk + son kilometre'],['first','Sadece ilk kilometre']],sim.scope)+field('Yıllık işletme günü','days',sim.days,'number','min="1" max="366" required')+field('Talep duyarlılık katsayısı','elasticity',sim.elasticity,'number','min="0" max="2" step="0.1" required','%50 destek × 0,6 katsayı = atıl kapasitenin %30’u kadar varsayımsal talep.')+'<label class="check"><input type="checkbox" name="access" '+(sim.access?'checked':'')+'>İlave seferlere %40 erişim indirimi ekle.</label></div></form><div class="mt">'+note('<strong>Bu bir talep tahmini değildir.</strong><br>Destek oranından kaç ton yük geçeceği, araştırmayla kalibre edilmiş bir model olmadan bilinemez. Buradaki katsayı, senaryoyu görünür kılan kullanıcı varsayımıdır.','warn')+'</div><details><summary>Hesap kapsamı</summary><div><p class="small muted">Kapasite pencereleri senaryo amacıyla günlük kabul edilir. Baz seferler: Afyon '+state.config.baselineAfyon+', Konya '+state.config.baselineKonya+'. İlave hacim, talep katsayısı ve kullanım hedefinin düşük olanıyla sınırlanır. İlave trenler 1.000 ton eşdeğeridir.<br><br>Yük sahibi hesabı serbest oran modelidir. Örnek uygun maliyet 30 km ilk + 10 km son ve 100 ₺/ton elleçlemedir. Erişim 36 ₺/tren-km; altyapı marjinal bakım 8,5 ₺/tren-km; dışsal fayda 0,80 ₺/ton-km varsayılır. Hepsi ön fizibilite girdisidir.</p></div></details></section><div id="simulationResults" class="stack" style="align-content:start"></div></div>'}
function simulationResults(){const s=simulationCalc();$('rateLabel').textContent='%'+sim.rate;$('targetLabel').textContent='%'+sim.target;$('simulationResults').innerHTML='<div class="grid g2">'+metric('Varsayımsal ilave yük',fmt(s.shift)+' <small>ton/yıl</small>','Talep katsayısı ve kapasiteyle sınırlı','box')+metric('Toplam destek eşdeğeri',tl(s.expense),'Yük sahibi + DTİ · yıllık senaryo','money',true)+metric('Kullanım oranı','%'+fmt(s.occupancy,1),'Baz sefer + ilave tren eşdeğeri','train')+metric('CO₂e azaltım potansiyeli',fmt(s.co)+' <small>ton/yıl</small>','İlk ve son karayolu bacağı dâhil','leaf')+'</div><section class="card pad"><div class="between mb"><h2>Destek oranlarını karşılaştır</h2>'+badge('Aynı varsayımlar')+'</div><div class="table-wrap"><table><thead><tr><th>Destek</th><th>İlave ton / yıl</th><th>Destek eşdeğeri</th><th>Kullanım</th></tr></thead><tbody>'+[20,30,50].map(rate=>{const r=simulationCalc({rate});return '<tr><td><strong>%'+rate+'</strong></td><td>'+fmt(r.shift)+'</td><td>'+tl(r.expense)+'</td><td>%'+fmt(r.occupancy,1)+'</td></tr>'}).join('')+'</tbody></table></div></section><section class="card pad"><h2>Mali etki ve ekonomik fayda</h2><div class="cost-line"><span>Yük sahibi desteği</span><strong>'+tl(s.owner)+'</strong></div><div class="cost-line"><span>DTİ erişim indirimi eşdeğeri</span><strong>'+tl(s.dti)+'</strong></div><div class="cost-line"><span>Net ilave erişim geliri<small>İndirim ve marjinal bakım düşülmüş</small></span><strong>'+tl(s.accessNet)+'</strong></div><div class="cost-line"><span>Sınırlı kapsamda mali denge<small>Net erişim geliri − yük sahibi desteği</small></span><strong class="'+(s.fiscal>=0?'green':'red')+'">'+tl(s.fiscal)+'</strong></div><div class="cost-line"><span>Toplumsal dışsal fayda tahmini<small>'+fmt(s.shift)+' ton × ağırlıklı km × 0,80 ₺/ton-km</small></span><strong>'+tl(s.economic)+'</strong></div><div class="cost-line"><span>Gösterge fayda / destek oranı<small>Tam ekonomik CBA değildir; iskonto uygulanmaz.</small></span><strong>'+(s.bc===null?'—':fmt(s.bc,2))+'</strong></div><div class="mt">'+note('Toplumsal dışsal fayda, kamuya tahsil edilmiş gelir değildir. Mali dengeye eklenmez; erişim indirimi de hem gider hem gelir kaybı olarak iki kez sayılmaz.')+'</div></section><div class="print-only small muted">DTBS · Varsayımsal politika senaryosu · '+new Date().toLocaleString('tr-TR')+' · Ahsen Sevim</div>'}
function methodologyPage(){return head('Güven, açık varsayımlarla başlar.','Kaynağı, hesap kuralını ve doğrulanması gereken noktaları birlikte görün.',btn(icon('download')+' Yerel kayıtları dışa aktar','export-json','ghost'))+'<div class="grid ratio"><div class="stack"><section class="card pad"><div class="eyebrow">MODEL SÖZLEŞMESİ</div><h2>Sunumda kullanılan temel kararlar</h2><div class="table-wrap mt"><table><thead><tr><th>Parametre</th><th>Bu sürüm</th><th>Dayanak / durum</th></tr></thead><tbody><tr><td>Tren yük kapasitesi</td><td><strong>20 × 50 = 1.000 ton</strong></td><td>Son kullanıcı talebi; eski 800 ton örnekleri güncellendi.</td></tr><tr><td>TIR kapasitesi</td><td>20 ton / TIR</td><td>Eski 800 ton / 40 TIR örneği; düzenlenebilir.</td></tr><tr><td>Tren ortalama hızı</td><td>25 km/sa</td><td>Son kullanıcı talebi; planlama varsayımı.</td></tr><tr><td>Konteyner yerleşimi</td><td>En çok 40 adet 20′ / tren</td><td>2 konteyner / vagon; yükün fiziksel uygunluğu ayrıca incelenir.</td></tr><tr><td>Afyon–Aliağa</td><td>415 km demiryolu / 370 km karayolu</td><td>Paylaşılan görsel; fiyat ve mesafe kurumsal teyit bekliyor.</td></tr><tr><td>Konya–Mersin</td><td>388 km demiryolu / 350 km karayolu</td><td>Paylaşılan görsel; ikinci koridor varsayımı.</td></tr><tr><td>Sefer pencereleri</td><td>'+state.config.afyon+' + '+state.config.konya+' = '+(state.config.afyon+state.config.konya)+'</td><td>Başlangıç 14 + 25 = 39. “49” ifadesiyle fark burada ayarlanabilir.</td></tr><tr><td>Kapasite dönemi</td><td>Günlük planlama penceresi</td><td>Kaynakta dönem net değil; pilot takvim ve simülasyon varsayımı.</td></tr><tr><td>Baz sefer</td><td>Afyon '+state.config.baselineAfyon+' / Konya '+state.config.baselineKonya+'</td><td>Afyon 6 rapordan; Konya 12 varsayımsal ve düzenlenebilir.</td></tr></tbody></table></div></section><section class="card pad"><h2>Teşvik hesabının açık formülü</h2><div class="note mt"><div><strong>Uygun gider</strong> = ilk km + seçilen son km + indirim sonrası uygun elleçleme<br><strong>Yük sahibi desteği</strong> = min(uygun gider × oran, pozitif maliyet açığı, dışsal fayda × %50, bütçe tavanı)<br><strong>Net ödeme</strong> = ilk km + ana demiryolu + elleçleme + son km − navluna yansıtılan erişim indirimi − yük sahibi desteği</div></div><p class="small muted mt">Serbest senaryo, maliyet açığı ve dışsal fayda sınırlarını devre dışı bırakır; oran ve bütçe tavanını uygular. Ticari elleçleme indirimi aynı giderden kamu desteği hesaplanmadan önce düşülür.</p><p class="small muted mt">Destek tutarı, hiçbir tavanı aşmamak için aşağı doğru tam kuruşa indirilir. Kantar için %2 tolerans ve referans fiyatın %50 üzerinde uyarı eşiği, bu prototipin kontrol varsayımlarıdır; resmî mevzuat eşiği değildir.</p><div class="divider"></div><h3>DTİ performans mantığı</h3><p class="small muted mt8">İlk baz seferler destek dışıdır. Doluluk %60 altındaysa erişim indirimi sıfırdır. %60–79 aralığı için bu prototipte %50 performans katsayısı varsayılır; %80 ve üzeri tam katsayı kullanılır. Program gerçekleşmesi en az %90, DB2/ECM/çevre kontrolleri tam olmalıdır. Bir seferin indirimi yalnız bir hakedişe yazılır.</p></section><section class="card pad"><h2>Kaynaklar ve çelişen örnekler</h2><div class="cost-line"><span>SONNNN.docx · Eylül 2026<small>Ahsen Sevim · Program tasarımı ve ön fizibilite</small></span>'+badge('Kullanıcı kaynağı')+'</div><div class="cost-line"><span>Paylaşılan HTML ve tablolar<small>Arayüz örnekleri, 800 ton maliyetleri ve mesafeler</small></span>'+badge('Örnek veri')+'</div><p class="small muted mt">Raporda birden fazla teşvik önerisi (%50 erişim indirimi, %40/%30/%20 kademesi, €/ton-km ve farklı sabit destekler) bulunuyor. Bu sürüm, karar tablosundaki yıllık kademeleri esas alır. Alternatif modeller birbirine eklenmez.</p><p class="small muted mt">800 tonluk ana demiryolu örnekleri ton başına çevrilerek ölçeklenir: Afyon 258.250 / 800 = 322,8125 ₺/ton; Konya 241.400 / 800 = 301,75 ₺/ton. Bu doğrusal ölçekleme tarife teklifi yerine geçmez.</p><p class="small muted mt">Emisyon katsayıları 0,070 kg CO₂e/ton-km karayolu ve 0,026 kg CO₂e/ton-km demiryolu olarak önceki HTML örneğinden alınmıştır. Ortalama cer karışımı varsayımıdır; onaylı karbon sertifikası üretmez.</p><p class="small muted mt">Metodolojik başvuru: <a href="https://transport.ec.europa.eu/transport-themes/sustainable-transport/internalisation-transport-external-costs_en" target="_blank" rel="noopener noreferrer">Avrupa Komisyonu · Taşımacılık dışsal maliyet çalışmaları</a>. Bu kaynak yöntem çerçevesidir; uygulamadaki Türkiye tarifelerinin doğrulaması değildir.</p><p class="small muted mt">Raporun farklı dışsallık tabloları aynı katsayı setini kullanmıyor. Bunlar kesin kamu geliri olarak taşınmadı. 44 ton muafiyeti, Dozvola önceliği, bakım desteği ve hukuki öneriler bu uygulamada yürürlükte hak gibi sunulmaz; yetkili kurum değerlendirmesi gerekir.</p></section></div><div class="stack" style="align-content:start"><section class="card pad"><h2>Pilot kapasite ayarları</h2><form id="configForm" class="mt"><div class="form-grid">'+field('Afyon sefer penceresi','afyon',state.config.afyon,'number','min="1" max="48" step="1" required')+field('Konya sefer penceresi','konya',state.config.konya,'number','min="1" max="48" step="1" required')+field('Afyon baz sefer','baselineAfyon',state.config.baselineAfyon,'number','min="0" max="48" step="1" required')+field('Konya baz sefer','baselineKonya',state.config.baselineKonya,'number','min="0" max="48" step="1" required')+'</div><button type="submit" class="btn primary mt">'+icon('check')+' Ayarları uygula</button><p class="small muted mt8">İki koridorun toplamı en fazla 49. Etkin rezervasyon bulunan takvim yapısı değiştirilemez.</p></form></section><section class="card pad"><div class="eyebrow">VERİLERİNİZİN KONTROLÜ SİZDE</div><h2>Bu sürüm nasıl çalışır?</h2><p class="small muted mt">HTML dosyası internet olmadan açılabilir. Kayıtlar tarayıcı depolamasında, belgeler yerel dosya veritabanında tutulur. Dosya yükleme işlemi dış sunucuya gönderim yapmaz.</p><p class="small muted mt">Başka tarayıcı veya cihaz kayıtları paylaşmaz. Tarayıcı verileri silinirse kayıtlar kaybolabilir. JSON dışa aktarımı belgelerin içeriğini içermez; belgeleri dosya ekranından ayrıca indirebilirsiniz.</p><div class="divider"></div><div class="stack" style="gap:10px">'+btn(icon('download')+' Kayıtları JSON olarak indir','export-json','')+btn(icon('download')+' Başvuru listesini CSV indir','export-csv','')+btn(icon('refresh')+' Örnek verileri yeniden oluştur','reset-data','danger')+'</div></section><section class="card pad"><h3>Canlı kullanım için sonraki aşama</h3><p class="small muted mt">Kimlik ve kurum yetkileri, paylaşılan veritabanı, belge saklama politikası, TCDD ve U-ETDS bağlantıları, e-Belge kontrolleri, harita / adres servisi ve yetkili ödeme akışı.</p><p class="small muted mt">Bu bağlantılar bu tek dosyalık pilotta simüle edilir. Rol değişimi yalnızca iş akışını göstermek içindir.</p></section></div></div>'}

async function restoreBackup(){if(!backupCandidate)throw Error('Önce bir yedek dosyası seçin.');const candidate=backupCandidate,db=await database(),previousFiles=[];for(const f of candidate.files)previousFiles.push({id:f.id,file:await dbFile('get',f.id)});const writeFiles=rows=>new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite'),store=tx.objectStore('files');rows.forEach(f=>f.file?store.put(f.file,f.id):store.delete(f.id));tx.oncomplete=resolve;tx.onabort=()=>reject(Error('Dosya arşivi yüklenemedi.'));tx.onerror=()=>reject(tx.error);});await writeFiles(candidate.files);const previous=state,previousRecovery=recoveryRaw;state=candidate.state;recoveryRaw=null;if(!save()){recoveryRaw=previousRecovery;await writeFiles(previousFiles);throw Error('Tarayıcıya kayıt yazılamadı. Mevcut kayıtlar korundu.');}backupCandidate=null;document.querySelector('.recovery-alert')?.remove();appStatusFilter='all';appFilter='';selectedSlot=null;selectedApp=state.apps[0]?.id||'';currentApp=null;closeModal();render();toast('Yedek doğrulandı ve yerel kayıtlar geri yüklendi.');}

document.addEventListener('change',async e=>{try{if(e.target.id==='appStatusFilter'){appStatusFilter=e.target.value;$('applicationTable').innerHTML=appTable(filteredApps());}if(e.target.id==='backupInput')await stageBackup(e.target.files[0]);}catch(err){toast(err.message||'Yedek okunamadı.',true)}});
function invalidateTrainEntitlements(a){const r=state.reservations.find(r=>r.app===a.id&&!['İptal','Bekleme listesi'].includes(r.status));if(!r)return;const stamp=new Date().toISOString();for(const other of state.apps.filter(x=>x.entitlement?.slot===r.slot)){other.entitlement=null;other.paymentRequested=false;other.audit.push({at:stamp,role:state.role,text:'Ortak seferin kanıtı değişti; hakediş taslağı yeniden değerlendirme için kaldırıldı.'});other.audit=other.audit.slice(-2000);}}
function validatedLocalState(raw){const value=JSON.parse(raw),role=value.role,activity=value.activity;const checked=validateArchive({format:'DTBS_BACKUP',formatVersion:1,state:value,files:[]}).state;checked.role=['Yük sahibi','DTİ','Organizatör','TCDD','Program uzmanı'].includes(role)?role:'Yük sahibi';checked.activity=Array.isArray(activity)?activity.slice(0,100):[];return checked;}
function recoveryAlert(){if(document.querySelector('.recovery-alert'))return;const el=document.createElement('section');el.className='recovery-alert';el.setAttribute('role','alert');el.innerHTML='<div><strong>Mevcut kayıt okunamadı; üzerine yazılmadı.</strong><p>Örneklerle geçici görünüm açıldı. Kurtarma kopyasını indirin; Model & varsayımlar ekranından geçerli bir dosyalı yedek yükleyin veya açık onayla örnek verileri yeniden oluşturun.</p></div>'+btn('Kurtarma kopyasını indir','download-recovery','small');document.body.append(el);}
window.addEventListener('afterprint' ,()=>document.body.classList.remove('print-report'));
document.addEventListener('dtbs-map-offline',()=>{if($('networkStatus'))$('networkStatus').textContent='Çevrimiçi harita servisine erişilemedi. Yerel Türkiye haritası ve tüm uygulama işlevleri kullanılabilir.'});

if(storedRaw&&recoveryRaw===null){try{state=validatedLocalState(storedRaw);}catch{recoveryRaw=storedRaw;state=seed();storageError=true;}}
committedRaw=JSON.stringify(state);render();if(recoveryRaw!==null)recoveryAlert();
})();
</script>
